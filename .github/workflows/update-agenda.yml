name: Update agenda
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: agenda-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s scripts/tests
      - name: Get last published agenda
        run: |
          git fetch origin codex/agenda-feed
          mkdir -p /tmp/agenda-output
          git show origin/codex/agenda-feed:catalog.json > /tmp/agenda-baseline.json
      - name: Refresh when due
        id: due
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          b = json.load(open('/tmp/agenda-baseline.json'))
          now = datetime.now(timezone.utc)
          active = any(p['event'].get('starts_on') and p['event'].get('ends_on') and datetime.fromisoformat(p['event']['starts_on']).date() - timedelta(days=1) <= now.date() <= datetime.fromisoformat(p['event']['ends_on']).date() for p in b['events'])
          age = (now - datetime.fromisoformat(b.get('generated_at', '2000-01-01T00:00:00+00:00'))).total_seconds()
          due = os.environ['MANUAL'] == 'true' or age >= (600 if active else 3500)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f"run={str(due).lower()}\n")
          PY
      - if: steps.due.outputs.run == 'true'
        run: python scripts/update_agenda.py --baseline /tmp/agenda-baseline.json --output /tmp/agenda-output/catalog.json
      - name: Publish validated feed
        if: steps.due.outputs.run == 'true'
        run: |
          git worktree add /tmp/agenda-publish origin/codex/agenda-feed
          cp /tmp/agenda-output/catalog.json /tmp/agenda-publish/catalog.json
          cd /tmp/agenda-publish
          git config user.name 'OXP Agenda Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git diff --cached --quiet || git commit -m 'Refresh agenda from Odoo'
          git push origin HEAD:codex/agenda-feed
