name: Update agenda
on:
  workflow_dispatch:
  schedule:
    # UTC envelope around local India and Belgium event dates; the gate below
    # enforces exact local dates, the year, and a two-hour minimum interval.
    - cron: '7 */2 8-12,21-26 9 *'
permissions:
  contents: write
  actions: write
concurrency:
  group: agenda-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Check event window
        id: window
        run: python3 scripts/agenda_schedule.py
      - name: Stop scheduling after Belgium
        if: steps.window.outputs.action == 'disable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-agenda.yml/disable"
      - name: Get last published agenda and attempt
        if: steps.window.outputs.action == 'refresh'
        run: |
          git fetch origin codex/agenda-feed
          mkdir -p /tmp/agenda-output
          git show origin/codex/agenda-feed:catalog.json > /tmp/agenda-baseline.json
          git show origin/codex/agenda-feed:last-attempt.txt > /tmp/agenda-attempt.txt 2>/dev/null || true
      - name: Check two-hour interval
        if: steps.window.outputs.action == 'refresh'
        id: due
        run: python3 scripts/agenda_schedule.py --baseline /tmp/agenda-baseline.json --attempt /tmp/agenda-attempt.txt
      - if: steps.due.outputs.action == 'refresh'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.due.outputs.action == 'refresh'
        run: pip install -r requirements.txt
      - if: steps.due.outputs.action == 'refresh'
        run: python -m unittest discover -s scripts/tests
      - name: Record attempt before contacting Odoo
        if: steps.due.outputs.action == 'refresh'
        run: |
          git worktree add /tmp/agenda-publish origin/codex/agenda-feed
          cd /tmp/agenda-publish
          git config user.name 'OXP Agenda Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > last-attempt.txt
          git add last-attempt.txt
          git commit -m 'Record agenda refresh attempt'
          git push origin HEAD:codex/agenda-feed
      - name: Refresh active edition only
        if: steps.due.outputs.action == 'refresh'
        env:
          EDITIONS: ${{ steps.due.outputs.events }}
        run: python scripts/update_agenda.py --baseline /tmp/agenda-baseline.json --output /tmp/agenda-output/catalog.json --events $EDITIONS
      - name: Publish validated feed
        if: steps.due.outputs.action == 'refresh'
        run: |
          cp /tmp/agenda-output/catalog.json /tmp/agenda-publish/catalog.json
          cd /tmp/agenda-publish
          git add catalog.json
          git diff --cached --quiet || git commit -m 'Refresh agenda from Odoo'
          git push origin HEAD:codex/agenda-feed
